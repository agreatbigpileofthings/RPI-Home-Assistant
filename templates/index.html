<!DOCTYPE html>
<html>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<head>
	<title> Baby's First Dashboard </title>
</head>

<body class ="bg-dark text-light">
	<h1 class ="mb-4">
		 AI Home Dashboard
	 </h1>
	<div class="card bg-secondary mb-3">
		<div class ="card-body">
		<h3>CPU Usage</h3>
			<p id="cpu">0%</p>
		</div>
	</div>
	
	<div class="card bg-secondary mb-3">
		<div class ="card-body">
		<h3>RAM Usage</h3>		
			<p id="ram">0%</p>
		</div>
	</div>

	<div class="card bg-secondary mb-3">
		<div class ="card-body">
		<h3>Temperature </h3>
			<p id="temp">C</p>
		</div>
	</div>
	<div class="card bg-secondary mb-3">
		<div class ="card-body">
			<h3>Motion Detected</h3>
			<p id="motion">No Motion Detected</p>
		</div>
	</div>

	<h3>Live Feed</h3>
		<p><img src="/video"> </p>
	</div>
<script
	src="{{ url_for('static', filename='app.js') }}">
</script>

</body>

</html>
